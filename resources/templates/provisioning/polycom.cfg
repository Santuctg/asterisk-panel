<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<!-- Polycom auto-provisioning template (application/sip: format). -->
<dhcpBoot>
  <bootServerUri>0</bootServerUri>
</dhcpBoot>
<uplink instant="1">
  <eth0>
    <port>1</port>
    <speed>auto</speed>
    <duplex>auto</duplex>
    <lldp>1</lldp>
  </eth0>
</uplink>
<voIpProt.SIP>
  <server voIpProt.SIP.1.address="{{SIP_SERVER}}"
          voIpProt.SIP.1.port="{{SIP_PORT}}"
          voIpProt.SIP.1.transport="UDP"
          voIpProt.SIP.1.register="1"
          voIpProt.SIP.1.registerExpires="3600"
          voIpProt.SIP.1.outboundProxy.address=""
          voIpProt.SIP.1.outboundProxy.port=""/>
  <identity voIpProt.SIP.identity.1.address="{{SIP_USER}}"
            voIpProt.SIP.identity.1.displayName="{{DISPLAY_NAME}}"
            voIpProt.SIP.identity.1.auth.password="{{SIP_PASS}}"
            voIpProt.SIP.identity.1.auth.userId="{{SIP_AUTH}}"
            voIpProt.SIP.identity.1.label="{{DISPLAY_NAME}}"/>
  <sip
    voIpProt.SIP.local.port="{{SIP_PORT}}"
    voIpProt.SIP.local.identity.1.address="{{SIP_USER}}"
    voIpProt.SIP.local.identity.1.displayName="{{DISPLAY_NAME}}"
    voIpProt.SIP.local.identity.1.auth.password="{{SIP_PASS}}"
    voIpProt.SIP.local.identity.1.auth.userId="{{SIP_AUTH}}"
    voIpProt.SIP.local.identity.1.mode="1"/>
</voIpProt.SIP>
<ntp
  ntp.server.name="{{TIME_SERVER}}"
  ntp.server.mode="1"/>
<provision
  provision.serverClass.1.address="{{SIP_SERVER}}/prov/{{MAC_LOWER}}.cfg"
  provision.serverClass.1.type="1"
  provision.serverClass.1.protocol="1"
  provision.subscribe="1"/>
<call>
  <call defaultCallList="1" offhookFeatureKeyDnd="1"/>
</call>
