<?xml version="1.0" encoding="UTF-8"?>
<!-- Yealink auto-provisioning template.
     Served at /prov/<mac>.cfg. Tokens like {{SIP_USER}} are replaced at request time. -->
<!DOCTYPE PolycomUFFS SYSTEM "aae.conf">
<phone>
  <wallpaper>
    <url></url>
  </wallpaper>
  <screensaver>
    <timeout>0</timeout>
    <type>clock</type>
  </screensaver>

  <!-- Time -->
  <date>
    <ntp>
      <ntpServer1>{{TIME_SERVER}}</ntpServer1>
      <ntpServer2></ntpServer2>
      <ntpMode>1</ntpMode>
    </ntp>
    <timeZone>0</timeZone>
    <daylightSaving>
      <mode>1</mode>
    </daylightSaving>
  </date>

  <!-- SIP account -->
  <sip voipdigitmape164="1">
    <proxy voipdigitmape164="1">
      <name keep="1" register="1">{{SIP_SERVER}}</name>
      <port keep="1">{{SIP_PORT}}</port>
      <transport>0</transport>
      <outboundProxy keep="1"></outboundProxy>
    </proxy>
    <reg voipdigitmape164="1">
      <regExtension keep="1">{{SIP_USER}}</regExtension>
      <regOn>1</regOn>
      <label keep="1">{{DISPLAY_NAME}}</label>
      <displayName keep="1">{{DISPLAY_NAME}}</displayName>
      <authName keep="1">{{SIP_AUTH}}</authName>
      <authPassword keep="1">{{SIP_PASS}}</authPassword>
      <userRealname keep="1">{{CID_NAME}}</userRealname>
      <phoneNumber keep="1">{{CID_NUM}}</phoneNumber>
    </reg>
  </sip>

  <!-- Line key / BLF for the local extension -->
  <featureKeys>
    <line>
      <key lineKeyNum="1">
        <label keep="1">{{DISPLAY_NAME}}</label>
        <value keep="1">{{SIP_USER}}</value>
        <type keep="1">15</type>
      </key>
    </line>
  </featureKeys>

  <!-- Soft keys -->
  <softkey>
    <key ehsDialsoftkey="1">
      <normal index="1">Redial</normal>
      <normal index="2">New Call</normal>
      <normal index="3">Transfer</normal>
      <normal index="4">Conf</normal>
      <normal index="5">Hold</normal>
      <idle index="1">New Call</idle>
      <idle index="2">Menu</idle>
    </key>
  </softkey>

  <!-- Provisioning server re-check -->
  <autoProvision>
    <url keep="1">{{SIP_SERVER}}/prov/{{MAC_LOWER}}.cfg</url>
    <interval keep="1">3600</interval>
    <randomDelay>1</randomDelay>
  </autoProvision>

  <!-- Audio -->
  <audio>
    <preferHeadset>0</preferHeadset>
    <headsetHoldOff>0</headsetHoldOff>
  </audio>
</phone>
