<?xml version="1.0" encoding="UTF-8"?>
<!-- Grandstream auto-provisioning template (XML config). -->
<gs_phoneConfig version="1">
  <gs_phoneProgram>
    <!-- Server / provisioning -->
    <P271>{{SIP_SERVER}}</P271>
    <P272>{{SIP_PORT}}</P272>
    <P237>{{SIP_SERVER}}/prov/{{MAC_LOWER}}.cfg</P237>
    <P238>1</P238>

    <!-- Account 1 -->
    <P1>{{SIP_USER}}</P1>
    <P2>{{SIP_PASS}}</P2>
    <P3>{{SIP_AUTH}}</P3>
    <P4>{{DISPLAY_NAME}}</P4>
    <P5>{{CID_NAME}}</P5>
    <P6>{{CID_NUM}}</P6>
    <P47>1</P47>
    <P270>{{SIP_SERVER}}</P270>

    <!-- Time -->
    <P196>{{TIME_SERVER}}</P196>
    <P144>1</P144>

    <!-- Tone / DTMF -->
    <P140>0</P140>
    <P100>0</P100>

    <!-- Call features -->
    <P278>0</P278>
    <P183>1</P183>
  </gs_phoneProgram>
</gs_phoneConfig>
