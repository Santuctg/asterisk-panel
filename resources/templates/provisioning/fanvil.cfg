<?xml version="1.0" encoding="UTF-8"?>
<!-- Fanvil auto-provisioning template. -->
<config version="1.0.0.1">
  <SIP>
    <Line item="1">
      <Registrar>{{SIP_SERVER}}</Registrar>
      <Proxy>{{SIP_SERVER}}</Proxy>
      <Port>{{SIP_PORT}}</Port>
      <AuthName>{{SIP_AUTH}}</AuthName>
      <AuthPassword>{{SIP_PASS}}</AuthPassword>
      <DisplayName>{{DISPLAY_NAME}}</DisplayName>
      <UserName>{{SIP_USER}}</UserName>
      <PhoneNumber>{{CID_NUM}}</PhoneNumber>
      <Register>1</Register>
      <RegisterExpires>3600</RegisterExpires>
    </Line>
  </SIP>
  <Network>
    <NTP>
      <NTPServer>{{TIME_SERVER}}</NTPServer>
      <Timezone>80</Timezone>
    </NTP>
    <Provision>
      <ProvisionServer>{{SIP_SERVER}}</ProvisionServer>
      <ProvisionUrl>/prov/{{MAC_LOWER}}.xml</ProvisionUrl>
      <Interval>3600</Interval>
    </Provision>
  </Network>
</config>
