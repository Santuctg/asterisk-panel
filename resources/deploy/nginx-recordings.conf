location ^~ /_protected/recordings/ {
    internal;
    alias "/var/spool/asterisk/monitor/asterisk-panel/";
    default_type audio/wav;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /_protected/moh/ {
    internal;
    alias "/var/lib/asterisk/moh/";
    default_type audio/wav;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /_protected/announcements/ {
    internal;
    alias "/var/lib/asterisk/sounds/asterisk-panel/";
    default_type audio/wav;
    add_header X-Content-Type-Options "nosniff" always;
}
