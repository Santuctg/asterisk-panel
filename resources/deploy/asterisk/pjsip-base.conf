;; Installed by Asterisk Panel. Safe base templates for generated PJSIP objects.

; UDP, TCP and TLS listeners are generated from System -> Settings.
#include asterisk_panel/pjsip_port.conf

; SIP over WebSocket. TLS terminates at the same-origin Nginx /ws endpoint.
[panel-transport-ws]
type = transport
protocol = ws
bind = 0.0.0.0

[endpoint_basic](!)
type = endpoint
transport = panel-transport-udp
allow = !all,ulaw,alaw,g722
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
trust_id_inbound = yes
identify_by = username,auth_username

[auth](!)
type = auth
auth_type = userpass

[aor](!)
type = aor
qualify_frequency = 60

[trunk-basic](!)
type = endpoint
transport = panel-transport-udp
allow = !all,ulaw,alaw,g722
dtmf_mode = rfc4733
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes
trust_id_inbound = yes

[registration](!)
type = registration
retry_interval = 60
forbidden_retry_interval = 300
expiration = 300
